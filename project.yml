name: AiHeart
options:
  bundleIdPrefix: local.aiheart
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  AiHeartCore:
    path: Packages/AiHeartCore
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AiHeart:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AiHeartCore
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aiheart.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AiHeart
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "AiHeart uses Face ID to lock your journal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Listen turns what you say into text on this phone only. Nothing is sent anywhere."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AiHeart records voice notes only when you tap the microphone. They stay on your devices."
        INFOPLIST_KEY_NSCameraUsageDescription: "AiHeart takes photos for your journal. They stay in the app, not your Camera Roll."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "AiHeart shows today's photos so you can pick one to write about. A photo you pick is copied into the app without its location."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "AiHeart saves the heart rate, weight and blood pressure you type in the morning check-in to Apple Health, on this device."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "AiHeart reads sleep, heart, breathing, temperature and activity to show your body against your own usual. Nothing leaves your device."
        CODE_SIGN_ENTITLEMENTS: App/AiHeart.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AiHeartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AiHeart
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AiHeart:
    build:
      targets:
        AiHeart: all
    test:
      targets: [AiHeartUITests]
